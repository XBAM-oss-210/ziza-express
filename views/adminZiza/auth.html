<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/admin/style.css">
    <title>Connexion Admin</title>
</head>
<body>
    <div id="auth-form-container">
        <form action="" id="auth-form">
            <h1>Connexion</h1>
            <div id="msg-error"></div>

            <div class="form-group">
                <input type="tel" id="phone" class="input-field" placeholder="Votre numéro de téléphone">
                <div id="error-phone" class="error-field"></div>
            </div>

            <div class="form-group">
                <input type="password" id="password" class="input-field" placeholder="Mot de passe">
                <div id="error-password" class="error-field"></div>
            </div>

            <div class="form-group">
                <input type="password" id="password2" class="input-field" placeholder="Confirmer votre mot de passe">
                <div id="error-password2" class="error-field"></div>
            </div>
            <div id="msg-error"></div>
            <div id="rate-limit-msg" style="display:none;"></div>
            <button type="submit">Se connecter</button>
        </form>
    </div>

    <script src="/js/validationAdmin_front.js"></script>
</body>
</html>
